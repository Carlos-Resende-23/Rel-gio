<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Relógio Digital</title>
  </head>
  <body>
    <div class="relogio">
      <button id="tema-btn">Mudar tema</button>
      <div class="tempo">
        <div class="bloco">
          <span class="label">Horas</span>
          <span id="horas">00</span>
        </div>

        <div class="bloco">
          <span class="label">Minutos</span>
          <span id="minutos">00</span>
        </div>

        <div class="bloco">
          <span class="label">Segundos</span>
          <span id="segundos">00</span>
        </div>
      </div>

      <div id="data"></div>
    </div>

    <div class="cronometro-container">
      <h2>Cronômetro</h2>

      <p id="cronometro">00:00:00</p>

      <div class="botoes-cronometro">
        <button id="iniciar">
          <ion-icon name="play-outline"></ion-icon>
        </button>
        <button id="pausar">
          <ion-icon name="pause-outline"></ion-icon>
        </button>
        <button id="reiniciar">
          <ion-icon name="reload-outline"></ion-icon>
        </button>
      </div>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
