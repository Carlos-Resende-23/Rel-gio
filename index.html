<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101d2d" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <title>Relógio Digital</title>
  </head>
  <body>
    <div class="relogio">
      <button id="tema-btn">Mudar tema</button>
      <div class="tempo">
        <div class="bloco">
          <span class="label">Horas</span>
          <span id="horas">00</span>
        </div>

        <div class="bloco">
          <span class="label">Minutos</span>
          <span id="minutos">00</span>
        </div>

        <div class="bloco">
          <span class="label">Segundos</span>
          <span id="segundos">00</span>
        </div>
      </div>

      <div id="data"></div>
    </div>

    <div class="cronometro-container">
      <h2>Cronômetro</h2>

      <p id="cronometro">
        <span id="tempo-principal">00:00:00</span
        ><span class="milissegundos">.000</span>
      </p>

      <div class="botoes-cronometro">
        <button id="iniciar" aria-label="Iniciar cronômetro">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </button>
        <button id="pausar" aria-label="Pausar cronômetro">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
          </svg>
        </button>
        <button id="reiniciar" aria-label="Reiniciar cronômetro">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 5a7 7 0 1 1-6.7 9H2.8A10 10 0 1 0 12 2v3zm-8 1h6v6H8V8H4z"></path>
          </svg>
        </button>
      </div>
      <div class="botoes-voltas">
        <button id="volta">Volta</button>
        <button id="limpar-voltas">Limpar voltas</button>
      </div>
      <h2>VOLTAS:</h2>
      <ul id="lista-voltas"></ul>
    </div>

    <div class="temporizador-container">
      <h2>Temporizador</h2>

      <div class="campos-temporizador">
        <label>
          Horas
          <input
            id="horas-temporizador"
            type="number"
            min="0"
            max="99"
            value="0"
          />
        </label>
        <label>
          Minutos
          <input
            id="minutos-temporizador"
            type="number"
            min="0"
            max="59"
            value="0"
          />
        </label>
        <label>
          Segundos
          <input
            id="segundos-temporizador"
            type="number"
            min="0"
            max="59"
            value="0"
          />
        </label>
      </div>

      <p id="temporizador">00:00:00</p>
      <p
        id="aviso-temporizador"
        class="aviso-temporizador"
        aria-live="polite"
        hidden
      >
        ⏰ Tempo esgotado!
      </p>

      <div class="botoes-temporizador">
        <button id="iniciar-temporizador" aria-label="Iniciar temporizador">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </button>
        <button id="pausar-temporizador" aria-label="Pausar temporizador">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
          </svg>
        </button>
        <button id="reiniciar-temporizador" aria-label="Reiniciar temporizador">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M12 5a7 7 0 1 1-6.7 9H2.8A10 10 0 1 0 12 2v3zm-8 1h6v6H8V8H4z"></path>
          </svg>
        </button>
        <button
          id="silenciar-temporizador"
          type="button"
          aria-label="Silenciar alarme do temporizador"
          title="Silenciar alarme do temporizador"
        >
          🔊
        </button>
        <button
          id="notificacoes-temporizador"
          type="button"
          aria-label="Ativar notificações do temporizador"
          title="Ativar notificações do temporizador"
        >
          🔔
        </button>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
